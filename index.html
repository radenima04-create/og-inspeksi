<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Our Garage — Inspeksi Harian</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --muted: #64748b;
      --primary: #1e3a5f;
      --primary-light: #2a5298;
      --ok: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --card: #fff;
      --input-bg: #f8fafc;
      --border: #e5e7eb;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; background: var(--bg); color: #1e293b; }

    /* TOP NAV */
    .topbar {
      background: var(--primary);
      padding: 12px 16px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .topbar .title { font-weight: 800; font-size: 15px; }
    .topbar .sub { color: #94a3b8; font-size: 11px; margin-top: 2px; }

    /* BOTTOM TABS */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .bottom-nav button {
      flex: 1;
      padding: 10px 0 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: color .15s;
    }
    .bottom-nav button .tab-icon { font-size: 20px; }
    .bottom-nav button.active { color: var(--primary); }
    .bottom-nav button.active .tab-icon { transform: scale(1.1); }

    .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px 90px; }

    /* CARDS */
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-title { font-weight: 700; font-size: 15px; color: var(--primary); margin-bottom: 12px; }

    /* INPUTS */
    .label { display: block; font-weight: 600; color: #475569; margin-bottom: 5px; font-size: 13px; }
    .input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      background: var(--input-bg);
      outline: none;
      color: #1e293b;
      font-family: inherit;
    }
    .input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--primary); }
    .btn.danger { background: var(--danger); border-color: var(--danger); }
    .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 8px; width: auto; }

    /* UNIT LIST */
    .unit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .unit-item:active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
    .unit-avatar {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: #eef2ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* PROGRESS */
    .progress-bar { height: 6px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .progress-bar .fill { height: 100%; background: var(--primary-light); transition: width .3s; border-radius: 6px; }

    /* ACCORDION */
    .accordion { border-radius: 14px; overflow: hidden; border: 1.5px solid var(--border); margin-bottom: 10px; }
    .accordion .acc-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: #f8fafc;
      border: none;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    .accordion .acc-head .acc-title { font-weight: 700; font-size: 14px; }
    .accordion .acc-body { background: #fff; }
    .item-row { padding: 13px 16px; border-top: 1px solid #f1f5f9; }
    .item-hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* STATUS BUTTONS */
    .status-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .status-btns button {
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      color: #9ca3af;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: all .15s;
    }
    .status-btns button.active { font-weight: 700; }

    /* PILLS */
    .pill {
      font-size: 11px; font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    /* SUMMARY GRID */
    .summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .summary-tile { padding: 12px 8px; border-radius: 12px; text-align: center; }
    @media(max-width:480px) { .summary-grid { grid-template-columns: repeat(2,1fr); } }

    /* RECORD LIST */
    .record-item {
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .record-item:active { border-color: var(--primary); }
    .record-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .record-unit { font-weight: 700; font-size: 14px; color: #1e293b; }
    .record-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .record-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 10px; }
    .badge-ok { background: #f0fdf4; color: var(--ok); border: 1px solid #86efac; }
    .badge-warn { background: #fffbeb; color: var(--warn); border: 1px solid #fcd34d; }
    .badge-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fca5a5; }
    .badge-layak { background: #f0fdf4; color: var(--ok); border: 1px solid #86efac; }
    .badge-tidak { background: #fef2f2; color: var(--danger); border: 1px solid #fca5a5; }

    /* TABS (within record view) */
    .tab-active { color: var(--primary); border-bottom: 2px solid var(--primary); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 48px 24px; color: #94a3b8; }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* NOTE INPUT */
    .note-input {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      font-size: 13px;
      font-family: inherit;
      width: 100%;
      outline: none;
    }

    /* MODAL overlay for record detail */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-sheet {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 16px 40px;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 40px; height: 4px; background: #e5e7eb; border-radius: 4px; margin: 0 auto 16px; }

    /* date filter bar */
    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    small { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="title">🚗 Our Garage — Inspeksi Harian</div>
    <div class="sub" id="top-date"></div>
  </div>

<div id="app" class="wrap"></div>

<nav class="bottom-nav" id="bottom-nav">
  <button id="tab-inspeksi" class="active" onclick="switchTab('inspeksi')">

  <button id="tab-record" onclick="switchTab('record')">

    { id:"lampu_dpn",  label:"Lampu Depan",           hint:"Low & high beam menyala normal" },
    { id:"lampu_blk",  label:"Lampu Belakang & Rem",  hint:"Aktif saat pedal rem ditekan" },
    { id:"sein",       label:"Sein & Hazard",          hint:"Kiri-kanan berfungsi; tidak terlalu cepat" },
    { id:"lampu_mdr",  label:"Lampu Mundur",           hint:"Menyala saat posisi R" },
    { id:"kaca_dpn",   label:"Kaca Depan & Wiper",     hint:"Tidak retak; wiper menyapu bersih" },

    { id:"sabuk",      label:"Sabuk Pengaman",           hint:"Semua baris; klik lancar; tidak robek" },
    { id:"klakson",    label:"Klakson",                  hint:"Berbunyi normal" },
    { id:"p3k",        label:"Kotak P3K",               hint:"Tersedia & lengkap di dalam mobil" },
    { id:"stnk",       label:"STNK di Kendaraan",       hint:"Ada & valid (tidak expired)" },
  ]},
  { id:"bbm", icon:"⛽", label:"Bahan Bakar", items:[
    { id:"level_bbm",  label:"Level BBM",               hint:"Min 1/4 tangki sebelum diserahkan ke penyewa" },
    { id:"tipe_bbm",   label:"Tipe BBM Sesuai Unit",    hint:"Pertalite / Pertamax / Solar / Pertamax Turbo" },
    { id:"bocor_bbm",  label:"Kebocoran Tangki/Selang", hint:"Tidak ada bau BBM; visual bawah kendaraan bersih" },
  ]},

const STATUS_CFG = {
  OK:        { color:"#16a34a", bg:"#f0fdf4", border:"#86efac" },
  PERHATIAN: { color:"#d97706", bg:"#fffbeb", border:"#fcd34d" },
  URGENT:    { color:"#dc2626", bg:"#fef2f2", border:"#fca5a5" },
};

// ─────────── STATE ───────────
let activeTab = 'inspeksi'; // inspeksi | record
let inspState = {
  step: "select", // select | form | result
  unit: null,
  inspektor: "",
  km: "",
  shift: "Pagi",
  expanded: "mesin",
  results: {},
  catNotes: {},
  layak: null,
  searchQ: "",
};

// Record state
let recordState = {
  filterDate: 'all', // 'all' | dateStr
  viewRecord: null,  // record object currently being viewed in modal
};

// ─────────── LOCAL STORAGE ───────────
const LS_KEY = 'og_inspeksi_records';

function getRecords() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveRecord(record) {
  const records = getRecords();
  records.unshift(record); // newest first
  localStorage.setItem(LS_KEY, JSON.stringify(records));
}

function deleteRecord(id) {
  const records = getRecords().filter(r => r.id !== id);
  localStorage.setItem(LS_KEY, JSON.stringify(records));
}

// ─────────── UTILS ───────────
function today() {
  return new Date().toLocaleDateString("id-ID", { day:"2-digit", month:"long", year:"numeric" });
}
function todayKey() {
  return new Date().toISOString().split('T')[0]; // YYYY-MM-DD
}
function nowTime() {
  return new Date().toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" });
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function isMoto(u) {
  const p = u.polisi;
  return p.startsWith("DK 3") || p.startsWith("DK 4") || p.startsWith("DK 5") ||
         p.startsWith("DK 6") || p.startsWith("DK 2971");
}
function filteredUnits() {
  const q = inspState.searchQ.trim().toLowerCase();
  if(!q) return UNITS;
  return UNITS.filter(u => u.polisi.toLowerCase().includes(q) || u.label.toLowerCase().includes(q));
}
function totalItems() { return CHECKLIST.reduce((a,c) => a+c.items.length, 0); }
function filledItems() { return Object.keys(inspState.results).length; }
function urgentItems() { return CHECKLIST.flatMap(c=>c.items).filter(i=>inspState.results[i.id]==="URGENT"); }
function perhatianItems() { return CHECKLIST.flatMap(c=>c.items).filter(i=>inspState.results[i.id]==="PERHATIAN"); }
function progress() { return Math.round((filledItems()/totalItems())*100)||0; }

function setInspState(part) { inspState = {...inspState, ...part}; render(); }
function setResult(itemId, val) {
  inspState.results = {...inspState.results};
  if(val) inspState.results[itemId] = val;
  else delete inspState.results[itemId];
  render();
}
function setCatNote(catId, key, val) {
  inspState.catNotes = {...inspState.catNotes};
  inspState.catNotes[catId] = {...(inspState.catNotes[catId]||{})};
  inspState.catNotes[catId][key] = val;
  // no re-render to avoid focus loss
}
function resetInspForm() {
  inspState = { step:"select", unit:null, inspektor:"", km:"", shift:"Pagi", expanded:"mesin", results:{}, catNotes:{}, layak:null, searchQ:"" };
  render();
}

// ─────────── TAB SWITCHING ───────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}

// ─────────── SUBMIT ───────────
function submitForm() {
  if(!inspState.inspektor) { alert("Nama inspektor wajib diisi."); return; }
  if(!inspState.layak) { alert("Pilih status kelayakan unit dulu ya."); return; }

  const okCount = Object.values(inspState.results).filter(v=>v==='OK').length;
  const record = {
    id: Date.now().toString(),
    dateKey: todayKey(),
    date: today(),
    time: nowTime(),
    unit: inspState.unit,
    inspektor: inspState.inspektor,
    shift: inspState.shift,
    km: inspState.km,
    layak: inspState.layak,
    results: {...inspState.results},
    catNotes: JSON.parse(JSON.stringify(inspState.catNotes)),
    okCount,
    perhatianCount: perhatianItems().length,
    urgentCount: urgentItems().length,
    urgentList: urgentItems().map(i=>i.label),
    perhatianList: perhatianItems().map(i=>i.label),
  };
  saveRecord(record);

  inspState.step = "result";
  inspState._savedRecord = record;
  render();
}

function generateCSV(record) {
  const r = record || inspState._savedRecord;
  const rows = [
    ["INSPEKSI HARIAN — OUR GARAGE INDONESIA GROUP"],
    [`Tanggal,${r.date}`],
    [`Waktu,${r.time}`],
    [`Unit,${r.unit.polisi} — ${r.unit.label}`],
    [`Inspektor,${r.inspektor}`],
    [`Shift,${r.shift}`],
    [`KM Odometer,${r.km}`],
    [`Kelayakan,${r.layak === "layak" ? "✅ LAYAK" : "❌ TIDAK LAYAK"}`],
    [""],
    ["Kategori,Item Inspeksi,Status,Catatan"],
  ];
  CHECKLIST.forEach(cat=>{
    cat.items.forEach(item=>{
      const status = r.results[item.id] || "BELUM DICEK";
      const note = (r.catNotes[cat.id]||{})[item.id]||"";
      rows.push([`"${cat.label}"`,`"${item.label}"`,status,`"${note}"`]);
    });
  });
  rows.push([""],["URGENT", `"${r.urgentList.join("; ")}"`]);
  rows.push(["PERHATIAN",`"${r.perhatianList.join("; ")}"`]);
  return rows.map(r=>r.join(",")).join("\n");
}

function handleCopyCSV(record) {
  const text = generateCSV(record);
  navigator.clipboard.writeText(text).then(()=> alert("Data berhasil dicopy! Paste ke Google Sheets.")).catch(()=>{
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert("Data berhasil dicopy!");
  });
}

    });
  });

  return root;
}

// ─────────── RECORD MODAL ───────────
function openRecordModal(record) {
  const overlay = el('div','modal-overlay');
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };

  const sheet = el('div','modal-sheet');
  sheet.innerHTML='<div class="modal-handle"></div>';

  // Status
  const isLayak = record.layak==='layak';
  const titleDiv = el('div');
  titleDiv.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div>
        <div style="font-weight:800;font-size:16px">${record.unit.polisi}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:3px">${record.unit.label}</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:2px">${record.date} · ${record.time} · Shift ${record.shift}</div>
        <div style="font-size:12px;color:#94a3b8">${record.inspektor}${record.km?' · KM '+Number(record.km).toLocaleString('id-ID'):''}</div>
      </div>
      <span class="badge ${isLayak?'badge-layak':'badge-tidak'}" style="font-size:13px;padding:4px 12px">${isLayak?'✅ LAYAK':'❌ TIDAK LAYAK'}</span>
    </div>`;

  // Summary strip
  titleDiv.innerHTML += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
    <div style="background:#f0fdf4;border-radius:10px;padding:10px;text-align:center;border:1px solid #86efac">
      <div style="font-size:20px;font-weight:800;color:var(--ok)">${record.okCount}</div>
      <div style="font-size:11px;font-weight:700;color:var(--ok)">OK</div>
    </div>
    <div style="background:#fffbeb;border-radius:10px;padding:10px;text-align:center;border:1px solid #fcd34d">
      <div style="font-size:20px;font-weight:800;color:var(--warn)">${record.perhatianCount}</div>
      <div style="font-size:11px;font-weight:700;color:var(--warn)">PERHATIAN</div>
    </div>
    <div style="background:#fef2f2;border-radius:10px;padding:10px;text-align:center;border:1px solid #fca5a5">
      <div style="font-size:20px;font-weight:800;color:var(--danger)">${record.urgentCount}</div>
      <div style="font-size:11px;font-weight:700;color:var(--danger)">URGENT</div>
    </div>
  </div>`;
  sheet.appendChild(titleDiv);

  // Urgent
  if(record.urgentCount>0){
    const uc = el('div');
    uc.style.cssText='background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:12px;margin-bottom:10px';
    uc.innerHTML='<div style="font-weight:700;font-size:13px;color:var(--danger);margin-bottom:6px">🚨 Item URGENT</div>';
    record.urgentList.forEach(l=>{ const d=el('div',null,'• '+l); d.style.cssText='font-size:13px;font-weight:600;padding:3px 0'; uc.appendChild(d); });
    sheet.appendChild(uc);
  }

  // Perhatian
  if(record.perhatianCount>0){
    const pc = el('div');
    pc.style.cssText='background:#fffbeb;border:1.5px solid #fcd34d;border-radius:12px;padding:12px;margin-bottom:10px';
    pc.innerHTML='<div style="font-weight:700;font-size:13px;color:var(--warn);margin-bottom:6px">⚠️ Item PERHATIAN</div>';
    record.perhatianList.forEach(l=>{ const d=el('div',null,'• '+l); d.style.cssText='font-size:13px;font-weight:600;padding:3px 0'; pc.appendChild(d); });
    sheet.appendChild(pc);
  }

  // Full list (collapsed by default)
  const detailToggle = el('button','btn ghost small'); detailToggle.textContent='Lihat Semua Item ▼';
  detailToggle.style.marginBottom='10px';
  let detailOpen = false;
  const detailWrap = el('div'); detailWrap.style.display='none';

  CHECKLIST.forEach(cat=>{
    const catWrap = el('div'); catWrap.style.marginBottom='12px';
    catWrap.innerHTML=`<div style="font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">${cat.icon} ${cat.label}</div>`;
    cat.items.forEach(item=>{
      const val = record.results[item.id];
      const cfg = val ? STATUS_CFG[val] : null;
      const row = el('div'); row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9';
      const left = el('span',null,item.label); left.style.cssText='font-size:13px;color:#334155';
      const right = el('span');
      if(cfg){ right.textContent=(val==='OK'?'✅ ':'⚠️ ')+val; right.style.cssText=`font-size:11px;font-weight:700;color:${cfg.color};background:${cfg.bg};padding:2px 8px;border-radius:10px;border:1px solid ${cfg.border}`; }
      else { right.textContent='—'; right.style.color='#cbd5e1'; }
      row.appendChild(left); row.appendChild(right);
      catWrap.appendChild(row);
    });
    detailWrap.appendChild(catWrap);
  });

  detailToggle.onclick=()=>{
    detailOpen=!detailOpen;
    detailWrap.style.display=detailOpen?'block':'none';
    detailToggle.textContent=detailOpen?'Sembunyikan Detail ▲':'Lihat Semua Item ▼';
  };
  sheet.appendChild(detailToggle);
  sheet.appendChild(detailWrap);

  // Actions
  const acts = el('div'); acts.style.cssText='display:flex;flex-direction:column;gap:8px;margin-top:4px';
  const copyBtn = el('button','btn'); copyBtn.style.cssText='background:#2563eb;border-color:#2563eb';
  copyBtn.textContent='📋 Copy ke Google Sheets';
  copyBtn.onclick=()=>handleCopyCSV(record);
  const delBtn = el('button','btn danger'); delBtn.textContent='🗑 Hapus Record Ini';
  delBtn.onclick=()=>{
    if(confirm(`Hapus record inspeksi ${record.unit.polisi} pada ${record.date}?`)){
      deleteRecord(record.id);
      overlay.remove();
      render();
    }
  };
  const closeBtn2 = el('button','btn ghost'); closeBtn2.textContent='Tutup';
  closeBtn2.onclick=()=>overlay.remove();
  acts.appendChild(copyBtn); acts.appendChild(delBtn); acts.appendChild(closeBtn2);
  sheet.appendChild(acts);

  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

// ─────────── MAIN RENDER ───────────
const app = document.getElementById('app');
const topDate = document.getElementById('top-date');
const topTime = document.getElementById('top-time');
topDate.textContent = today();
topTime.textContent = nowTime();

function render() {
  app.innerHTML='';
  if(activeTab==='inspeksi'){
    if(inspState.step==='select') app.appendChild(renderSelect());
    else if(inspState.step==='form') app.appendChild(renderForm());
    else if(inspState.step==='result') app.appendChild(renderResult());
  } else {
    app.appendChild(renderRecordTab());
  }
}

render();
setInterval(()=>{ topTime.textContent=nowTime(); }, 60000);
</script>
</body>
</html>
